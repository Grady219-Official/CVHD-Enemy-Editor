<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Harmony of Despair Enemy Editor</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        max-width: 1050px;
        margin: 30px auto;
        padding: 0 20px;
        background: #f4f4f4;
        color: #222;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #666;
        margin-top: 0;
        margin-bottom: 20px;
    }

    .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        background: white;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
    }

    select,
    input,
    button {
        padding: 8px;
        font-size: 14px;
    }

    select {
        min-width: 260px;
    }

    button {
        cursor: pointer;
    }

    button:disabled {
        cursor: default;
        opacity: 0.5;
    }

    #enemyHeader {
        display: none;
        background: white;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 15px;
    }

    #enemyDisplayName {
        margin: 0;
        font-size: 28px;
    }

    #internalName {
        color: #666;
        margin-top: 5px;
        font-family: monospace;
    }

    #editor {
        background: white;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 20px;
    }

    .field {
        display: grid;
        grid-template-columns: 220px 260px;
        gap: 12px;
        margin-bottom: 9px;
        align-items: center;
    }

    .field label {
        font-weight: bold;
    }

    .field input,
    .field select {
        width: 260px;
        max-width: 100%;
    }

    .readonly {
        background: #eee;
        color: #555;
    }

    .section {
        border: 1px solid #bbb;
        background: #fafafa;
        padding: 15px;
        margin: 20px 0;
        border-radius: 6px;
    }

    .section h3 {
        margin-top: 0;
        padding-bottom: 8px;
        border-bottom: 1px solid #ddd;
    }

    .percentage-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .percentage-wrapper input {
        width: 100px;
    }

    .percentage-symbol {
        font-weight: bold;
        color: #666;
    }

    .hex-note {
        font-size: 12px;
        color: #777;
        margin-left: 232px;
        margin-top: -4px;
        margin-bottom: 10px;
    }

    #status {
        margin-top: 12px;
        font-size: 13px;
        font-weight: bold;
    }

    @media (max-width: 650px) {
        body {
            margin: 15px auto;
            padding: 0 10px;
        }

        .field {
            grid-template-columns: 1fr;
            gap: 4px;
        }

        .field input,
        .field select {
            width: 100%;
        }

        .percentage-wrapper input {
            width: 120px;
        }

        .hex-note {
            margin-left: 0;
        }

        select {
            width: 100%;
        }

        .toolbar {
            align-items: stretch;
            flex-direction: column;
        }
    }
</style>
</head>

<body>

<h1>Harmony of Despair Enemy Editor</h1>

<p class="subtitle">
    Enemy parameter JSON editor
</p>

<div class="toolbar">

    <input
        type="file"
        id="fileInput"
        accept=".json"
    >

    <label>
        Enemy:
        <select id="enemySelect">
            <option>Load JSON first</option>
        </select>
    </label>

    <button
        id="applyButton"
        disabled
    >
        Apply Changes
    </button>

    <button
        id="downloadButton"
        disabled
    >
        Download Modified JSON
    </button>

</div>

<div id="enemyHeader">
    <h2 id="enemyDisplayName">Enemy</h2>
    <div id="internalName"></div>
</div>

<div id="editor">
    Load your enemy JSON file to begin.
</div>

<div id="status"></div>

/*
==============================================================
UNKNOWN FIELDS
==============================================================
*/

function isHiddenField(key) {
    const normalized = key.toLowerCase();

    return (
        normalized.includes("unknown") ||
        normalized.includes("unkown")
    );
}


/*
==============================================================
DROP CHANCE SCALE

25 internally = 2.5% in the editor.
==============================================================
*/

const dropChanceScale = 10;


/*
==============================================================
PROGRAM DATA
==============================================================
*/

let data = null;
let currentEnemyIndex = -1;


/*
==============================================================
ELEMENTS
==============================================================
*/

const fileInput = document.getElementById("fileInput");
const enemySelect = document.getElementById("enemySelect");
const editor = document.getElementById("editor");
const applyButton = document.getElementById("applyButton");
const downloadButton = document.getElementById("downloadButton");
const status = document.getElementById("status");
const enemyHeader = document.getElementById("enemyHeader");
const enemyDisplayName = document.getElementById("enemyDisplayName");
const internalName = document.getElementById("internalName");


/*
==============================================================
EVENTS
==============================================================
*/

fileInput.addEventListener("change", loadFile);
enemySelect.addEventListener("change", selectEnemy);

applyButton.addEventListener("click", function() {
    if (saveCurrentFields()) {
        status.textContent = "Changes applied.";
    }
});

downloadButton.addEventListener("click", downloadJSON);


/*
==============================================================
LOAD JSON
==============================================================
*/

function loadFile(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            data = JSON.parse(e.target.result);

            if (
                !data.enemy_section ||
                !Array.isArray(data.enemy_section)
            ) {
                throw new Error(
                    "JSON does not contain an enemy_section array."
                );
            }

            populateEnemyList();

            if (data.enemy_section.length > 0) {
                currentEnemyIndex = 0;
                enemySelect.value = "0";
                renderEnemy();
            }

            applyButton.disabled = false;
            downloadButton.disabled = false;

            status.textContent =
                "Loaded " +
                data.enemy_section.length +
                " enemies.";

        }

        catch (error) {

            alert(
                "Could not load JSON:\n\n" +
                error.message
            );

        }

    };

    reader.readAsText(file);
}


/*
==============================================================
DISPLAY NAME
==============================================================
*/

function getDisplayName(enemy) {

    if (!enemy) {
        return "Unknown Enemy";
    }

    const internal = enemy.name || "";

    return (
        enemyDisplayNames[internal] ||
        internal ||
        "Unknown Enemy"
    );
}


/*
==============================================================
ENEMY DROPDOWN
==============================================================
*/

function populateEnemyList() {

    enemySelect.innerHTML = "";

    data.enemy_section.forEach(
        function(enemy, index) {

            const option =
                document.createElement("option");

            option.value = String(index);

            const internal =
                enemy.name ||
                `Enemy ${index + 1}`;

            const display =
                enemyDisplayNames[internal];

            option.textContent =
                display
                    ? `${display} (${internal})`
                    : internal;

            enemySelect.appendChild(option);
        }
    );
}


/*
==============================================================
SWITCH ENEMY
==============================================================
*/

function selectEnemy() {

    const newIndex =
        Number(enemySelect.value);

    if (currentEnemyIndex >= 0) {

        if (!saveCurrentFields()) {

            enemySelect.value =
                String(currentEnemyIndex);

            return;
        }
    }

    currentEnemyIndex = newIndex;

    enemySelect.value =
        String(currentEnemyIndex);

    renderEnemy();

    status.textContent =
        "Selected: " +
        getDisplayName(
            data.enemy_section[currentEnemyIndex]
        );
}


/*
==============================================================
RENDER ENEMY
==============================================================
*/

function renderEnemy() {

    editor.innerHTML = "";

    if (
        !data ||
        currentEnemyIndex < 0
    ) {
        return;
    }

    const enemy =
        data.enemy_section[currentEnemyIndex];

    if (!enemy) {
        return;
    }

    updateEnemyHeader();

    /*
    Internal name.
    */

    renderField(
        "name",
        enemy.name
    );


    /*
    Compendium fields grouped visually.
    */

    renderCompendiumSection(enemy);


    /*
    Everything else.
    */

    Object.entries(enemy).forEach(
        function([key, value]) {

            if (
                key === "name" ||
                key === "compendium_picture" ||
                key === "compendium_name" ||
                key === "compendium_number"
            ) {
                return;
            }

            if (isHiddenField(key)) {
                return;
            }

            if (
                key === "item1_drop_chance" ||
                key === "item2_drop_chance" ||
                key === "soul_drop_chance"
            ) {
                return;
            }

            if (
                typeof value === "object" &&
                value !== null &&
                !Array.isArray(value)
            ) {

                renderObjectSection(
                    key,
                    value,
                    enemy
                );

            }

            else {

                renderField(
                    key,
                    value
                );

            }

        }
    );
}


/*
==============================================================
HEADER
==============================================================
*/

function updateEnemyHeader() {

    const enemy =
        data.enemy_section[currentEnemyIndex];

    enemyHeader.style.display = "block";

    enemyDisplayName.textContent =
        getDisplayName(enemy);

    internalName.textContent =
        "Internal name: " +
        enemy.name;
}


/*
==============================================================
NORMAL FIELD
==============================================================
*/

function renderField(
    key,
    value,
    customLabel = null
) {

    if (isHiddenField(key)) {
        return;
    }

    const row =
        document.createElement("div");

    row.className = "field";

    const label =
        document.createElement("label");

    label.textContent =
        customLabel || key;

    const input =
        document.createElement("input");

    input.value = value;
    input.dataset.key = key;
    input.dataset.type = typeof value;

    if (key === "name") {
        input.readOnly = true;
        input.classList.add("readonly");
    }

    row.appendChild(label);
    row.appendChild(input);
    editor.appendChild(row);
}


/*
==============================================================
COMPENDIUM
==============================================================
*/

function renderCompendiumSection(enemy) {

    const section =
        document.createElement("div");

    section.className = "section";

    const heading =
        document.createElement("h3");

    heading.textContent =
        "Compendium";

    section.appendChild(heading);

    if (
        Object.prototype.hasOwnProperty.call(
            enemy,
            "compendium_picture"
        )
    ) {
        renderTopLevelFieldIntoSection(
            section,
            "compendium_picture",
            enemy.compendium_picture,
            "Picture"
        );
    }

    if (
        Object.prototype.hasOwnProperty.call(
            enemy,
            "compendium_name"
        )
    ) {
        renderTopLevelFieldIntoSection(
            section,
            "compendium_name",
            enemy.compendium_name,
            "Name"
        );
    }

    if (
        Object.prototype.hasOwnProperty.call(
            enemy,
            "compendium_number"
        )
    ) {
        renderTopLevelFieldIntoSection(
            section,
            "compendium_number",
            enemy.compendium_number,
            "Number"
        );
    }

    editor.appendChild(section);
}


function renderTopLevelFieldIntoSection(
    section,
    key,
    value,
    labelText
) {

    const row =
        document.createElement("div");

    row.className = "field";

    const label =
        document.createElement("label");

    label.textContent = labelText;

    const input =
        document.createElement("input");

    input.value = value;
    input.dataset.key = key;
    input.dataset.type = typeof value;

    row.appendChild(label);
    row.appendChild(input);
    section.appendChild(row);
}


/*
==============================================================
ITEM GROUP
==============================================================
*/

function renderItemGroupField(
    section,
    sectionName,
    key,
    value
) {

    const row =
        document.createElement("div");

    row.className = "field";

    const label =
        document.createElement("label");

    label.textContent =
        "Item Category";

    const select =
        document.createElement("select");

    select.dataset.section = sectionName;
    select.dataset.key = key;
    select.dataset.type = "number";

    Object.entries(
        itemGroupCategories
    ).forEach(
        function([number, description]) {

            const option =
                document.createElement("option");

            option.value =
                String(number);

            option.textContent =
                description;

            select.appendChild(option);
        }
    );

    if (
        !Object.prototype.hasOwnProperty.call(
            itemGroupCategories,
            value
        )
    ) {

        const option =
            document.createElement("option");

        option.value =
            String(value);

        option.textContent =
            `${value} - Unknown category`;

        select.appendChild(option);
    }

    select.value =
        String(value);


    /*
    When category changes, save everything
    and immediately redraw the enemy.

    This changes Item Number between:
      normal numeric input
      weapon dropdown
    */

    select.addEventListener(
        "change",
        function() {

            if (saveCurrentFields()) {

                renderEnemy();

                status.textContent =
                    "Item category changed.";

            }
        }
    );


    row.appendChild(label);
    row.appendChild(select);
    section.appendChild(row);
}


/*
==============================================================
ITEM NUMBER

Only Weapons / group 03 gets a weapon dropdown.
Everything else remains numeric.
==============================================================
*/

function renderItemNumberField(
    section,
    sectionName,
    value,
    itemGroup
) {

    const row =
        document.createElement("div");

    row.className = "field";

    const label =
        document.createElement("label");

    label.textContent =
        "Item Number";


    /*
    Weapon category = group 3.
    */

    if (
        Number(itemGroup) === 3
    ) {

        const select =
            document.createElement("select");

        select.dataset.section =
            sectionName;

        select.dataset.key =
            "item_number";

        select.dataset.type =
            "number";


        Object.entries(
            weaponNames
        ).forEach(
            function([number, weaponName]) {

                const numericValue =
                    Number(number);

                const hexValue =
                    numericValue
                        .toString(16)
                        .toUpperCase()
                        .padStart(2, "0");

                const option =
                    document.createElement("option");

                option.value =
                    String(numericValue);

                option.textContent =
                    `${hexValue} - ${weaponName}`;

                select.appendChild(option);
            }
        );


        /*
        Preserve IDs not yet included
        in our weapon map.
        */

        if (
            !Object.prototype.hasOwnProperty.call(
                weaponNames,
                value
            )
        ) {

            const hexValue =
                Number(value)
                    .toString(16)
                    .toUpperCase()
                    .padStart(2, "0");

            const option =
                document.createElement("option");

            option.value =
                String(value);

            option.textContent =
                `${hexValue} - Unknown Weapon`;

            select.appendChild(option);
        }


        select.value =
            String(value);


        row.appendChild(label);
        row.appendChild(select);
        section.appendChild(row);


        const note =
            document.createElement("div");

        note.className =
            "hex-note";

        note.textContent =
            "Weapon name is display-only; the numeric item ID is preserved internally.";

        section.appendChild(note);

    }

    else {

        const input =
            document.createElement("input");

        input.value = value;

        input.dataset.section =
            sectionName;

        input.dataset.key =
            "item_number";

        input.dataset.type =
            typeof value;

        row.appendChild(label);
        row.appendChild(input);
        section.appendChild(row);
    }
}


/*
==============================================================
DROP CHANCE
==============================================================
*/

function renderDropChanceField(
    section,
    jsonKey,
    internalValue
) {

    const row =
        document.createElement("div");

    row.className = "field";

    const label =
        document.createElement("label");

    label.textContent =
        "Drop Chance";

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "percentage-wrapper";

    const input =
        document.createElement("input");

    input.type = "number";
    input.step = "0.1";
    input.min = "0";

    input.value =
        (
            Number(internalValue) /
            dropChanceScale
        ).toFixed(1);

    input.dataset.key =
        jsonKey;

    input.dataset.type =
        "percentage";

    const symbol =
        document.createElement("span");

    symbol.className =
        "percentage-symbol";

    symbol.textContent = "%";

    wrapper.appendChild(input);
    wrapper.appendChild(symbol);

    row.appendChild(label);
    row.appendChild(wrapper);

    section.appendChild(row);
}


/*
==============================================================
NESTED SECTIONS
==============================================================
*/

function renderObjectSection(
    sectionName,
    objectValue,
    enemy
) {

    const visibleEntries =
        Object.entries(objectValue)
            .filter(
                function([key]) {
                    return !isHiddenField(key);
                }
            );

    if (
        visibleEntries.length === 0
    ) {
        return;
    }

    const section =
        document.createElement("div");

    section.className =
        "section";

    const heading =
        document.createElement("h3");


    if (
        sectionName === "floor_item1"
    ) {
        heading.textContent =
            "Item Drop 1";
    }

    else if (
        sectionName === "floor_item2"
    ) {
        heading.textContent =
            "Item Drop 2";
    }

    else if (
        sectionName === "soul_drop"
    ) {
        heading.textContent =
            "Soul Drop";
    }

    else {
        heading.textContent =
            sectionName;
    }


    section.appendChild(heading);


    /*
    For item sections we control the rendering
    order explicitly:
        Category
        Item Number
        Drop Chance
    */

    if (
        sectionName === "floor_item1" ||
        sectionName === "floor_item2" ||
        sectionName === "soul_drop"
    ) {

        if (
            Object.prototype.hasOwnProperty.call(
                objectValue,
                "item_group"
            )
        ) {

            renderItemGroupField(
                section,
                sectionName,
                "item_group",
                objectValue.item_group
            );
        }


        if (
            Object.prototype.hasOwnProperty.call(
                objectValue,
                "item_number"
            )
        ) {

            renderItemNumberField(
                section,
                sectionName,
                objectValue.item_number,
                objectValue.item_group
            );
        }


        if (
            sectionName === "floor_item1" &&
            Object.prototype.hasOwnProperty.call(
                enemy,
                "item1_drop_chance"
            )
        ) {

            renderDropChanceField(
                section,
                "item1_drop_chance",
                enemy.item1_drop_chance
            );
        }


        if (
            sectionName === "floor_item2" &&
            Object.prototype.hasOwnProperty.call(
                enemy,
                "item2_drop_chance"
            )
        ) {

            renderDropChanceField(
                section,
                "item2_drop_chance",
                enemy.item2_drop_chance
            );
        }


        if (
            sectionName === "soul_drop" &&
            Object.prototype.hasOwnProperty.call(
                enemy,
                "soul_drop_chance"
            )
        ) {

            renderDropChanceField(
                section,
                "soul_drop_chance",
                enemy.soul_drop_chance
            );
        }

    }

    else {

        /*
        Non-item nested objects such as
        damage_resistance.
        */

        visibleEntries.forEach(
            function([key, value]) {

                const row =
                    document.createElement("div");

                row.className =
                    "field";

                const label =
                    document.createElement("label");

                label.textContent =
                    key;

                const input =
                    document.createElement("input");

                input.value =
                    value;

                input.dataset.section =
                    sectionName;

                input.dataset.key =
                    key;

                input.dataset.type =
                    typeof value;

                row.appendChild(label);
                row.appendChild(input);

                section.appendChild(row);
            }
        );
    }


    editor.appendChild(section);
}


/*
==============================================================
SAVE CURRENT VALUES
==============================================================
*/

function saveCurrentFields() {

    if (
        !data ||
        currentEnemyIndex < 0
    ) {
        return true;
    }

    const enemy =
        data.enemy_section[
            currentEnemyIndex
        ];

    const fields =
        editor.querySelectorAll(
            "input, select"
        );


    /*
    Validation.
    */

    for (
        const field of fields
    ) {

        const type =
            field.dataset.type;

        if (
            type === "number" ||
            type === "percentage"
        ) {

            if (
                Number.isNaN(
                    Number(field.value)
                )
            ) {

                alert(
                    "Invalid numeric value for " +
                    field.dataset.key
                );

                field.focus();

                return false;
            }
        }
    }


    /*
    Save values.
    */

    fields.forEach(
        function(field) {

            const key =
                field.dataset.key;

            const section =
                field.dataset.section;

            const type =
                field.dataset.type;

            let value =
                field.value;


            if (
                type === "percentage"
            ) {

                value =
                    Math.round(
                        Number(value) *
                        dropChanceScale
                    );

            }

            else if (
                type === "number"
            ) {

                value =
                    Number(value);
            }


            if (section) {

                enemy[
                    section
                ][
                    key
                ] = value;

            }

            else {

                enemy[
                    key
                ] = value;
            }

        }
    );


    return true;
}


/*
==============================================================
DOWNLOAD JSON
==============================================================
*/

function downloadJSON() {

    if (!data) {
        return;
    }

    if (!saveCurrentFields()) {
        return;
    }

    const jsonText =
        JSON.stringify(
            data,
            null,
            2
        );

    const blob =
        new Blob(
            [jsonText],
            {
                type:
                    "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "enemy_data_modified.json";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

    status.textContent =
        "Modified JSON downloaded.";
}
